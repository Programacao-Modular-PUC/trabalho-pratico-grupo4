<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SisHosp Maraú · Cadastrar Cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="barra"></aside>
    <div class="conteudo">
      <div class="pagina">

        <div class="breadcrumb"><a href="clientes.html">Clientes</a> › <span id="bc">Novo cliente</span></div>
        <h1 id="titulo">Cadastrar cliente</h1>
        <p class="subtitulo mb-2">Preencha os dados do cliente</p>

        <div class="card" style="max-width:680px;">
          <div class="campo"><label>Nome completo</label><input type="text" id="nome" placeholder="Maria das Graças Silva" /></div>
          <div class="campos-2">
            <div class="campo"><label>CPF</label><input type="text" id="cpf" placeholder="000.000.000-00" /></div>
            <div class="campo"><label>Telefone</label><input type="text" id="telefone" placeholder="(75) 9 9999-9999" /></div>
          </div>
          <div class="campo"><label>E-mail</label><input type="email" id="email" placeholder="cliente@email.com" /></div>
          <div class="campo"><label>Endereço</label><input type="text" id="endereco" placeholder="Rua das Flores, 12 – Maraú, BA" /></div>

          <hr />
          <div class="acoes">
            <button class="btn btn-primario" id="btnSalvar">Salvar cliente</button>
            <a href="clientes.html" class="btn btn-contorno">Cancelar</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/cadastro-clientes.js"></script>
</body>
</html>
