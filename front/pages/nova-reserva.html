<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SisHosp Maraú · Nova Reserva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="barra"></aside>
    <div class="conteudo">
      <div class="pagina">

        <h1>Nova reserva</h1>
        <p class="subtitulo mb-2">Selecione o quarto, o período e o cliente</p>

        <div class="grid-2">

          <div>
            <div class="card mb-2">
              <h2>1. Residência e quarto</h2>
              <div class="campo">
                <label>Residência</label>
                <select id="selResidencia"><option value="">Carregando…</option></select>
              </div>
              <div id="quartos"><p class="text-muted">Selecione uma residência.</p></div>
            </div>

            <div class="card">
              <h2>2. Período e hóspedes</h2>
              <div class="campos-2">
                <div class="campo"><label>Entrada</label><input type="datetime-local" id="entrada" /></div>
                <div class="campo"><label>Saída</label><input type="datetime-local" id="saida" /></div>
              </div>
              <div class="campos-2">
                <div class="campo"><label>Número de hóspedes</label><input type="number" id="numHospedes" value="1" min="1" /></div>
                <div class="campo" style="justify-content:flex-end;">
                  <div class="check-linha" id="linhaBerco" style="display:none;">
                    <input type="checkbox" id="berco" /><label for="berco">Solicitar berço (+R$ 30/diária)</label>
                  </div>
                </div>
              </div>
              <div class="aviso aviso-info">As diárias iniciam às 12h. Saída após o meio-dia adiciona uma diária extra.</div>
            </div>
          </div>

          <div>
            <div class="card mb-2">
              <h2>3. Cliente</h2>
              <div class="campo">
                <label>Selecione o cliente</label>
                <select id="selCliente"><option value="">Carregando…</option></select>
              </div>
              <a href="cadastro-clientes.html" class="btn btn-contorno btn-peq">＋ Cadastrar novo cliente</a>
            </div>

            <div class="card">
              <h2>4. Resumo</h2>
              <div id="resumo"><p class="text-muted">Selecione um quarto e o período.</p></div>
              <button class="btn btn-primario btn-grande mt-2" id="btnConfirmar" disabled>Confirmar reserva</button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/nova-reserva.js"></script>
</body>
</html>
