<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SisHosp Maraú · Clientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="barra"></aside>
    <div class="conteudo">
      <div class="pagina">

        <div class="topo-secao">
          <div>
            <h1>Clientes</h1>
            <p class="subtitulo">Clientes cadastrados no sistema</p>
          </div>
          <a href="cadastro-clientes.html" class="btn btn-primario">＋ Novo cliente</a>
        </div>

        <div class="card">
          <div class="mb-2">
            <input type="text" id="busca" placeholder="Buscar por nome, CPF ou e-mail…" style="max-width:420px;" />
          </div>
          <div class="tabela-wrap">
            <table>
              <thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>E-mail</th><th>Aluguéis</th><th>Ações</th></tr></thead>
              <tbody id="tabela"><tr><td colspan="6" class="text-muted">Carregando…</td></tr></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/clientes.js"></script>
</body>
</html>
