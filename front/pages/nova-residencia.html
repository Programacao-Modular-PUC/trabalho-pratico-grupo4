<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SisHosp Maraú · Residência</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="barra"></aside>
    <div class="conteudo">
      <div class="pagina">

        <div class="breadcrumb"><a href="residencias.html">Residências</a> › <span id="bcTitulo">Nova residência</span></div>
        <h1 id="titulo">Cadastrar residência</h1>
        <p class="subtitulo mb-2">Preencha os dados do imóvel</p>

        <div class="card" style="max-width:840px;">
          <h2>Dados do imóvel</h2>

          <div class="campo">
            <label>Nome da residência</label>
            <input type="text" id="nome" placeholder="Casa Maré" />
          </div>

          <div class="campos-3">
            <div class="campo"><label>Endereço</label><input type="text" id="endereco" placeholder="Rua das Dunas" /></div>
            <div class="campo"><label>Número</label><input type="text" id="numero" placeholder="15" /></div>
            <div class="campo"><label>Bairro</label><input type="text" id="bairro" placeholder="Centro" /></div>
          </div>
          <div class="campos-3">
            <div class="campo"><label>CEP</label><input type="text" id="cep" placeholder="45520-000" /></div>
            <div class="campo"><label>Cidade</label><input type="text" id="cidade" placeholder="Maraú – BA" /></div>
            <div class="campo"><label>Telefone</label><input type="text" id="telefone" placeholder="(75) 9 9999-0000" /></div>
          </div>
          <div class="campo"><label>E-mail de contato</label><input type="email" id="email" placeholder="contato@residencia.com" /></div>

          <hr />

          <div id="blocoExistentes" style="display:none;">
            <h2>Quartos cadastrados</h2>
            <div id="quartosExistentes" class="mb-2"></div>
            <hr />
          </div>

          <h2>Adicionar quartos</h2>
          <p class="text-muted mb-2" style="font-size:.88rem;">Inclua os quartos que serão criados ao salvar.</p>
          <div id="quartosNovos"></div>
          <button class="btn btn-contorno btn-peq mb-2" id="btnAddQuarto">＋ Adicionar quarto</button>

          <hr />
          <div class="acoes">
            <button class="btn btn-primario" id="btnSalvar">Salvar residência</button>
            <a href="residencias.html" class="btn btn-contorno">Cancelar</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/nova-residencia.js"></script>
</body>
</html>
