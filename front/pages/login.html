<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SisHosp Maraú · Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="login-wrapper">

    <div class="login-hero">
      <div class="badge-marca">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0M2 17c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/>
          </svg>
        </div>
        <strong style="font-size:1.1rem;">SisHosp Maraú</strong>
      </div>
      <h1>Hospedagem<br/>da Península<br/>de Maraú</h1>
      <p>Sistema de gerenciamento de residências, quartos e aluguéis na costa baiana.</p>
      <p class="tags">Piscinas naturais · Recifes de coral · Mata Atlântica</p>
    </div>

    <div class="login-form-area">
      <div class="login-box">
        <h2>Bem-vindo de volta</h2>
        <p class="subtitulo mb-2">Acesse o painel para continuar</p>

        <div class="campo">
          <label>E-mail</label>
          <input type="email" id="email" value="operador@sishosp.com" />
        </div>
        <div class="campo">
          <label>Senha</label>
          <input type="password" id="senha" value="123456" />
        </div>

        <button class="btn btn-primario btn-grande" id="btnEntrar">Entrar no sistema</button>

        <hr />
        <p class="subtitulo" style="margin-bottom:.7rem;">Ainda não é cliente?</p>
        <a href="cadastro-clientes.html" class="btn btn-contorno btn-grande">Criar cadastro de cliente</a>
      </div>
    </div>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
