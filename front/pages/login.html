<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SisHosp Maraú  Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="estilo.css" />
  <style>
    body { background: var(--white); }

    .login-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }

    .login-hero {
      background: linear-gradient(155deg, #0D3D5E, #1A5F8A, #2378AC);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      text-align: center;
    }

    .login-hero .emoji {
      font-size: 3.5rem;
      margin-bottom: 1.2rem;
    }

    .login-hero h1 {
      font-size: 2.8rem;
      color: #fff;
      line-height: 1.15;
      margin-bottom: .8rem;
    }

    .login-hero p {
      color: rgba(255,255,255,.7);
      font-size: 1rem;
      line-height: 1.7;
      max-width: 320px;
    }

    .login-hero .rodape-hero {
      margin-top: 2.5rem;
      font-size: .78rem;
      color: rgba(255,255,255,.35);
      letter-spacing: .04em;
    }

    .login-form-area {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--white);
      padding: 3rem;
    }

    .login-box {
      width: 100%;
      max-width: 390px;
    }

    .login-box h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      color: var(--dark);
      margin-bottom: .3rem;
    }

    .login-box .subtitulo {
      color: var(--muted);
      font-size: .92rem;
      margin-bottom: 1.6rem;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">


    <div class="login-hero">
      <div class="emoji"></div>
      <h1>SisHosp<br>Maraú</h1>
      <p>Sistema de Gerenciamento de Hospedagens da Península de Maraú – Bahia</p>
      <p class="rodape-hero">Piscinas naturais · Recifes de coral · Mata Atlântica</p>
    </div>


    <div class="login-form-area">
      <div class="login-box">

        <h2>Bem-vindo</h2>
        <p class="subtitulo">Acesse sua conta para continuar</p>

        <div class="campo">
          <label>E-mail</label>
          <input type="email" value="joao@sishosp.com" />
        </div>

        <div class="campo">
          <label>Senha</label>
          <input type="password" value="12345678" />
        </div>

        <a href="02-dashboard.html" class="btn btn-primario btn-grande" style="margin-top:.3rem;">
          Entrar no Sistema
        </a>

        <hr style="margin: 1.4rem 0;" />

        <p class="subtitulo" style="margin-bottom:.8rem;">Ainda não tem conta?</p>
        <a href="10-cadastro-cliente.html" class="btn btn-contorno btn-grande">
          Criar nova conta
        </a>

      </div>
    </div>

  </div>

</body>
</html>
