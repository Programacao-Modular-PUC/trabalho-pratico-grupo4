<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SisHosp Maraú · Histórico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="barra"></aside>
    <div class="conteudo">
      <div class="pagina">

        <div class="topo-secao">
          <div>
            <h1>Histórico de hospedagens</h1>
            <p class="subtitulo">Todos os aluguéis registrados no sistema</p>
          </div>
        </div>

        <div class="card">
          <div class="gap mb-2">
            <select id="filtroResidencia" style="width:auto;"><option value="">Todas as residências</option></select>
            <select id="filtroStatus" style="width:auto;">
              <option value="">Todos os status</option>
              <option value="ATIVO">Ativos</option>
              <option value="CANCELADO">Cancelados</option>
            </select>
          </div>

          <div class="tabela-wrap">
            <table>
              <thead><tr><th>Nº</th><th>Cliente</th><th>Residência</th><th>Quarto</th><th>Entrada</th><th>Saída</th><th>Diárias</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead>
              <tbody id="tabela"><tr><td colspan="10" class="text-muted">Carregando…</td></tr></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/historico.js"></script>
</body>
</html>
