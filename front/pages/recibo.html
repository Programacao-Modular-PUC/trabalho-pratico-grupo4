<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SisHosp Maraú · Recibo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <div class="app">
    <aside class="sidebar nao-imprimir" id="barra"></aside>
    <div class="conteudo">
      <div class="pagina">

        <div id="avisoOk" class="aviso aviso-sucesso mb-3 nao-imprimir"
          style="max-width:640px; margin:0 auto 1.5rem; display:none;">
          ✓ Reserva confirmada com sucesso!
        </div>

        <div id="conteudoRecibo">
          <p class="text-muted" style="text-align:center;">Carregando recibo…</p>
        </div>

        <div class="acoes nao-imprimir" id="areaPagamento"
          style="max-width:640px; margin:1.4rem auto 0; justify-content:center; gap:.6rem; display:none; align-items:center;">
          <label for="selForma">Pagar com:</label>
          <select id="selForma" class="input" style="max-width:220px;">
            <option value="PIX">PIX</option>
            <option value="CARTAO_CREDITO">Cartão de Crédito</option>
            <option value="DINHEIRO">Dinheiro</option>
          </select>
          <button class="btn btn-primario" id="btnPagar">Processar pagamento</button>
        </div>

        <div class="acoes nao-imprimir" id="botoes"
          style="max-width:640px; margin:1.4rem auto 0; justify-content:center; display:none;">
          <button class="btn btn-primario" id="btnImprimir">Imprimir recibo</button>
          <button class="btn btn-perigo" id="btnCancelar">Cancelar reserva</button>
          <a href="dashboard.html" class="btn btn-contorno">Voltar ao painel</a>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/recibo.js"></script>
</body>

</html>
